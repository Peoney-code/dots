palette = "catppuccin_mocha"
# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# Добавлены $username и $hostname в начало строки
format = """
$username$hostname $cmd_duration 󰜥 $directory $git_branch
$character"""

[character]
success_symbol = "[   ](bold fg:blue)"
error_symbol = "[   ](bold fg:red)"

[package]
disabled = true

[username]
style_user = "bold bg:sapphire fg:base"
style_root = "red bold bg:sapphire fg:base"
format = "[](bold fg:sapphire)[$user](bold bg:sapphire fg:base)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bg:sapphire bold fg:base)[](bold fg:sapphire)"
trim_at = ".companyname.com"
disabled = false

[git_branch]
style = "bg:sapphire"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](bold fg:sapphire)[$symbol $branch(:$remote_branch)](fg:base bg:sapphire)[ ](bold fg:sapphire)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:base"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](bold fg:green)[󰉋 $path]($style)[](bold fg:green)'

# Linux / macOS — standard XDG / ~/Library-style folder names
[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:yellow)[󰪢 $duration](bold bg:yellow fg:base)[](bold fg:yellow)'

# Catppuccin Mocha — https://github.com/catppuccin/starship
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
